name: macOS build and storage tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test durable storage and annotations
        run: swift test
      - name: Build application bundle
        run: ./scripts/build-app.sh
      - name: Package and verify development ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Still.app dist/Still-macOS.zip
          unzip -t dist/Still-macOS.zip
          ditto -x -k dist/Still-macOS.zip "$RUNNER_TEMP/still-zip-check"
          test -x "$RUNNER_TEMP/still-zip-check/Still.app/Contents/MacOS/Still"
          codesign --verify --strict "$RUNNER_TEMP/still-zip-check/Still.app"
      - name: Create and verify drag-to-install disk image
        run: |
          mkdir -p dist/dmg-root
          ditto dist/Still.app dist/dmg-root/Still.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname Still -srcfolder dist/dmg-root -format UDZO -ov dist/Still.dmg
          hdiutil verify dist/Still.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/still-dmg-check" dist/Still.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/still-dmg-check"' EXIT
          test -x "$RUNNER_TEMP/still-dmg-check/Still.app/Contents/MacOS/Still"
          plutil -lint "$RUNNER_TEMP/still-dmg-check/Still.app/Contents/Info.plist"
          codesign --verify --strict "$RUNNER_TEMP/still-dmg-check/Still.app"
          file "$RUNNER_TEMP/still-dmg-check/Still.app/Contents/MacOS/Still"
          test -L "$RUNNER_TEMP/still-dmg-check/Applications"
          shasum -a 256 dist/Still.dmg dist/Still-macOS.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Still-macOS-development
          path: |
            dist/Still.dmg
            dist/Still-macOS.zip
            dist/SHA256SUMS.txt
